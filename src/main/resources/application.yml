# ============================================================
# ISP Automation Platform - Quarkus Application Configuration
# Live-reload hook: lesson draft vs publish
# Live-reload hook: subscription cancel status
# ============================================================

quarkus:
  application:
    name: isp-automation-backend
    version: 1.0.1-creator-dashboard

  http:
    port: ${PORT:8081}
    root-path: /
    cors:
      ~: true
      origins: ${CORS_ORIGINS:http://localhost:4900,http://127.0.0.1:4900,http://localhost:4200,http://127.0.0.1:4200}
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: Authorization,Content-Type,X-Requested-With
      exposed-headers: Content-Disposition
      access-control-max-age: 3600
      access-control-allow-credentials: true


  # ================= DATABASE =================
  datasource:
    db-kind: postgresql
    username: ${QUARKUS_DATASOURCE_USERNAME:postgres}
    password: ${QUARKUS_DATASOURCE_PASSWORD:postgres}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ispautomation}
      max-size: 20
      min-size: 5
      initial-size: 5


  # ================= HIBERNATE =================
  hibernate-orm:
    database:
      generation: validate
    log:
      sql: false
      format-sql: false
    jdbc:
      timezone: Africa/Nairobi


  # ================= FLYWAY =================
  flyway:
    enabled: true
    migrate-at-start: true
    baseline-on-migrate: true
    locations: db/migration
    table: flyway_schema_history
    validate-on-migrate: true


  # ================= REDIS (optional — Upstash free tier in production) =================
  redis:
    hosts: ${REDIS_URL:redis://localhost:6379}
    timeout: 5s
    health-enabled: false


  # ================= SECURITY =================
  # Disabled — app uses custom JWT handling via JwtAuthenticationFilter + SecurityContext
  smallrye-jwt:
    enabled: false


  # ================= OPENAPI =================
  swagger-ui:
    always-include: true


  # ================= HEALTH =================
  smallrye-health:
    root-path: health


  # ================= METRICS =================
  micrometer:
    export:
      prometheus:
        path: /metrics


  native:
    resources:
      includes: db/migration/**



# ============================================================
# APPLICATION CONFIGURATION
# ============================================================

app:

  jwt:

    # JWT signing key
    # Keep this secret and make it longer in production
    secret: ${JWT_SECRET:ispautomation-super-secret-key-change-this-to-a-long-random-value-123456789}

    # 15 minutes
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:900}

    # 7 days
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:604800}

    issuer: ispautomation

    audience: ispautomation-users



  security:

    rate-limit:

      login:

        max-attempts: 5

        window-seconds: 300


    password:

      min-length: 8

      bcrypt-strength: 12



  default-admin:

    username: ${DEFAULT_ADMIN_USERNAME:admin}

    password: ${DEFAULT_ADMIN_PASSWORD:Admin@123}

    email: ${DEFAULT_ADMIN_EMAIL:admin@ispautomation.com}

  google-groups:
    enabled: ${GOOGLE_GROUPS_ENABLED:false}
    webhook-url: ${GOOGLE_GROUPS_WEBHOOK_URL:}
    secret: ${GOOGLE_GROUPS_SECRET:}
    auto-create-group-on-root: ${GOOGLE_GROUPS_AUTO_CREATE_ON_ROOT:false}
    default-domain: ${GOOGLE_GROUPS_DEFAULT_DOMAIN:googlegroups.com}

  google:
    client-id: ${GOOGLE_CLIENT_ID:936423918383-606sfujp00scurea3cb7a37qsdoh202b.apps.googleusercontent.com}
    default-role: ${GOOGLE_DEFAULT_ROLE:STUDENT}

  # Cloudflare R2 — private lesson videos + signed playback URLs
  r2:
    enabled: ${R2_ENABLED:false}
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    region: ${R2_REGION:auto}
    playback-ttl-seconds: ${R2_PLAYBACK_TTL_SECONDS:900}



# ============================================================
# PRODUCTION PROFILE
# ============================================================

"%prod":

  quarkus:

    http:
      port: ${PORT:8080}

    datasource:

      db-kind: postgresql

      username: ${QUARKUS_DATASOURCE_USERNAME}

      password: ${QUARKUS_DATASOURCE_PASSWORD}

      jdbc:

        url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require



    hibernate-orm:

      database:

        generation: validate

      log:

        sql: false

        format-sql: false

      jdbc:

        timezone: Africa/Nairobi



    flyway:

      enabled: true

      migrate-at-start: true

      baseline-on-migrate: true

      locations: db/migration

      validate-on-migrate: true



    redis:

      hosts: ${REDIS_URL:redis://127.0.0.1:6379}

      timeout: 5s

      health-enabled: false



    swagger-ui:

      always-include: false



  app:

    jwt:

      secret: ${JWT_SECRET:ispautomation-production-secret-change-this}

    security:

      password:

        bcrypt-strength: 14

lms:
  server-fee-amount: ${LMS_SERVER_FEE_AMOUNT:5000}
  default-currency: ${LMS_DEFAULT_CURRENCY:UGX}
